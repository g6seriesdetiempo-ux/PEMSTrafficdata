bookdown::gitbook:
  css: style.css
  config:
    toc:
      before: |
        <li><a href="./">Análisis Series de Tiempo de un conjunto de datos de tráfico</a></li>
      after: |
        <li><a href="https://github.com/g6seriesdetiempo-ux/PEMSTrafficdata" target="blank">Published with bookdown</a></li>
    edit: https://github.com/g6seriesdetiempo-ux/PEMSTrafficdata /edit/BRANCH/%s
    download: ["pdf", "epub"]
bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
bookdown::epub_book: default
